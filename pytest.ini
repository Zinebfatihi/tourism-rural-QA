[pytest]
# Dossier où Pytest cherche les tests
testpaths = tests

# Conventions de nommage
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options appliquées à chaque exécution :
# -v        : sortie détaillée
# --html    : génère un rapport HTML autonome dans reports/
addopts = -v --html=reports/report.html --self-contained-html

# Marqueurs (catégories de tests) — utilisables avec « -m »
# ex. : pytest -m smoke
markers =
    smoke: tests critiques de base (P0), exécutés en priorité
    regression: suite de régression (P1)
    e2e: parcours métier complets de bout en bout
    negative: tests de comportement face à des entrées invalides
    security: tests de contrôle d'accès et d'autorisation
